<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Admit Card - {{ config_data.school_name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #e0eafc, #cfdef3);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .search-card {
            max-width: 480px;
            width: 100%;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
            padding: 30px;
        }
        .school-badge {
            font-size: 13px;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

<div class="search-card">
    <div class="text-center mb-4">
        <span class="badge bg-primary px-3 py-2 text-uppercase school-badge mb-2">
            {{ config_data.school_name }}
        </span>
        <h4 class="fw-bold text-dark mt-2">प्रवेश पत्र (Admit Card)</h4>
        <p class="text-muted small">सत्र: {{ config_data.academic_session }}</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, msg in messages %}
                <div class="alert alert-{{ category }} alert-dismissible fade show p-2 small" role="alert">
                    {{ msg }}
                    <button type="button" class="btn-close p-2" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form action="{{ url_for('check_admit_card') }}" method="POST">
        <div class="mb-3">
            <label class="form-label fw-semibold text-secondary">
                <i class="bi bi-person-badge"></i> स्कॉलर नंबर / रोल नंबर दर्ज करें
            </label>
            <input type="text" name="search_query" class="form-control form-control-lg text-center" 
                   placeholder="Enter Scholar No or Roll No" required autofocus>
        </div>

        <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold shadow-sm">
            <i class="bi bi-search"></i> एडमिट कार्ड देखें (Find Admit Card)
        </button>
    </form>

    <div class="text-center mt-4 pt-3 border-top">
        <a href="{{ url_for('login') }}" class="text-decoration-none small text-muted">
            <i class="bi bi-box-arrow-in-right"></i> Staff / Admin Login
        </a>
    </div>
</div>

</body>
</html>
